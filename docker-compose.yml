version: '3.8'

services:
  # 개발 환경
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    networks:
      - app-network

  # 프로덕션 환경
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '80:80'
    environment:
      - NODE_ENV=production
    networks:
      - app-network
    restart: unless-stopped

  # 개발용 nginx (필요시)
  nginx-dev:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    networks:
      - app-network
    depends_on:
      - app-dev

networks:
  app-network:
    driver: bridge

volumes:
  node_modules:
